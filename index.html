<!DOCTYPE html>
<html>
<head>
    <title>My First Project</title>

    <style>
        body {
            font-family: Arial;
            background: #111827;
            color: white;
            text-align: center;
            padding: 50px;
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }
    </style>
</head>

<body>

    <h1>🤖 My First Coding Project</h1>

    <p id="message">
        Welcome to my website!
    </p>

    <button onclick="sayHello()">
        Click Me
    </button>

    <script>
        function sayHello() {
            document.getElementById("message").textContent =
                "Hello! I made this with code! 🎉";
        }
    </script>

</body>
</html>
